name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests, screenshots, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HAS_FONTS: ${{ secrets.PLANB_FONTS_PASSPHRASE != '' }}
      FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decrypt licensed fonts
        if: env.HAS_FONTS == 'true'
        env:
          PLANB_FONTS_PASSPHRASE: ${{ secrets.PLANB_FONTS_PASSPHRASE }}
        run: tools/fonts.sh decrypt

      - name: Unit, database, end-to-end and screenshot tests
        # Screenshots are compared with artifacts/screenshots (rendered with the licensed font);
        # any difference fails the build. Without the fonts secret every test still runs and the
        # "Screenshots were verified" step below fails the job (except for fork pull requests).
        run: |
          if [ "$HAS_FONTS" = "true" ]; then
            ./gradlew testDebugUnitTest -Proborazzi.test.verify=true -Pplanb.requirePrivateFonts=true --continue
          else
            echo "::warning::Licensed fonts unavailable: running every test, but screenshots are not compared."
            ./gradlew testDebugUnitTest --continue
          fi

      - name: Android Lint
        run: ./gradlew lintDebug --continue

      - name: Build debug, release, test, benchmark and Wear OS artifacts
        run: >-
          ./gradlew assembleDebug :app:assembleRelease :app:bundleRelease
          :app:assembleDebugAndroidTest :baselineprofile:assemble :benchmark:assemble
          :wear:assembleRelease

      - name: Release manifest requests only allowlisted permissions
        # tools/allowed-permissions.txt is the complete list; any other permission (for example
        # one added by a new library) fails the build.
        run: tools/check_permissions.sh app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml

      - name: Screenshots were verified
        # Only fork pull requests (which never receive secrets) may skip the comparison.
        if: env.HAS_FONTS != 'true' && env.FROM_FORK != 'true'
        run: |
          echo "::error::The PLANB_FONTS_PASSPHRASE secret is missing, so screenshots were not verified. See docs/FONTS.md."
          exit 1

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*.html
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-b-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  instrumentation:
    name: Device tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
