name: Release

# Manual only: builds the signed release, the Cafe Bazaar .bin and checksums, optionally
# creates the GitHub Release, and only uploads to Cafe Bazaar when explicitly requested.
on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Create the vX.Y.Z tag and GitHub Release with the signed files"
        type: boolean
        default: true
      publish_to_cafebazaar:
        description: "Upload the signed APK to Cafe Bazaar (Pishkhan API) as a draft release"
        type: boolean
        default: false
      cafebazaar_auto_publish:
        description: "Ask Cafe Bazaar to publish automatically after review (only with upload)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed release and Cafe Bazaar package
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # tag and GitHub Release
    environment: release
    env:
      HAS_SIGNING: ${{ secrets.PLANB_KEYSTORE_BASE64 != '' && secrets.PLANB_KEYSTORE_PASSWORD != '' && secrets.PLANB_KEY_ALIAS != '' && secrets.PLANB_KEY_PASSWORD != '' && secrets.PLANB_FONTS_PASSPHRASE != '' }}
      HAS_BAZAAR_KEY: ${{ secrets.PLANB_BAZAAR_RSA_KEY != '' }}
      # Releases must ship the licensed typeface, never the fallback.
      PLANB_REQUIRE_PRIVATE_FONTS: "true"
    steps:
      - name: Note a missing Cafe Bazaar key
        if: env.HAS_BAZAAR_KEY != 'true'
        run: echo "::warning::PLANB_BAZAAR_RSA_KEY is not set; this release cannot sell Plan-B Pro (docs/PRO.md)."

      - name: Require release signing secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::Release secrets are not configured. Add PLANB_KEYSTORE_BASE64, PLANB_KEYSTORE_PASSWORD, PLANB_KEY_ALIAS, PLANB_KEY_PASSWORD and PLANB_FONTS_PASSPHRASE (repository or 'release' environment secrets). See RELEASE.md and docs/FONTS.md."
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Read version
        id: version
        run: |
          name="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          code="$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)"
          test -n "$name" && test -n "$code"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing Plan-B $name ($code)"

      - name: Decrypt licensed fonts
        env:
          PLANB_FONTS_PASSPHRASE: ${{ secrets.PLANB_FONTS_PASSPHRASE }}
        run: tools/fonts.sh decrypt

      - name: Quality gates
        run: ./gradlew testDebugUnitTest -Proborazzi.test.verify=true lintDebug

      - name: Decode release keystore
        env:
          PLANB_KEYSTORE_BASE64: ${{ secrets.PLANB_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/planb-release.jks"
          printf '%s' "$PLANB_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "PLANB_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release and Cafe Bazaar files
        env:
          PLANB_KEYSTORE_PASSWORD: ${{ secrets.PLANB_KEYSTORE_PASSWORD }}
          PLANB_KEY_ALIAS: ${{ secrets.PLANB_KEY_ALIAS }}
          PLANB_KEY_PASSWORD: ${{ secrets.PLANB_KEY_PASSWORD }}
          # Optional: the Cafe Bazaar RSA public key for Plan-B Pro purchases (docs/PRO.md).
          # Without it the release builds and runs, but its Pro screen says purchases are
          # not available in this version.
          PLANB_BAZAAR_RSA_KEY: ${{ secrets.PLANB_BAZAAR_RSA_KEY }}
        run: tools/package_cafebazaar.sh

      - name: Remove keystore and fonts
        if: always()
        run: rm -rf "$RUNNER_TEMP/planb-release.jks" private-fonts

      - name: Upload release files (workflow artifact, includes R8 mapping)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-b-v${{ steps.version.outputs.name }}-cafebazaar
          path: |
            release/cafebazaar/*.apk
            release/cafebazaar/*.aab
            release/cafebazaar/*.bin
            release/cafebazaar/*.txt
            release/cafebazaar/*.md
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.create_github_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Plan-B ${{ steps.version.outputs.name }}
          body_path: release/cafebazaar/RELEASE_NOTES_en.md
          fail_on_unmatched_files: true
          # Signed binaries and checksums only: never keystores, passwords or keys.
          files: |
            release/cafebazaar/Plan-B-v${{ steps.version.outputs.name }}-release.apk
            release/cafebazaar/Plan-B-v${{ steps.version.outputs.name }}-release.aab
            release/cafebazaar/Plan-B-v${{ steps.version.outputs.name }}-bazaar.bin
            release/cafebazaar/SHA256SUMS.txt
            release/cafebazaar/RELEASE_NOTES_fa.md
            release/cafebazaar/RELEASE_NOTES_en.md

      - name: Upload to Cafe Bazaar (Pishkhan API)
        if: inputs.publish_to_cafebazaar
        env:
          PISHKHAN_SECRET: ${{ secrets.CAFEBAZAAR_PISHKHAN_API_SECRET }}
          AUTO_PUBLISH: ${{ inputs.cafebazaar_auto_publish }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$PISHKHAN_SECRET" ]; then
            echo "::error::CAFEBAZAAR_PISHKHAN_API_SECRET is not set; upload the files from the release artifact manually (docs/CAFE_BAZAAR_RELEASE.md)."
            exit 1
          fi
          tools/publish_cafebazaar.sh "release/cafebazaar/Plan-B-v${VERSION}-release.apk"
